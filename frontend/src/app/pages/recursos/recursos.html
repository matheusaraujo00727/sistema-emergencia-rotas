<div class="page-header">
  <div>
    <h2>Recursos Operacionais</h2>
    <p>Controle dos recursos disponíveis para atendimento de emergências.</p>
  </div>
</div>

<div class="cards-grid">
  @for (recurso of recursos; track recurso.id) {
    <div class="resource-card">
      <div class="resource-header">
        <span class="code">{{ recurso.codigo }}</span>
        <span class="chip" [ngClass]="recurso.status.toLowerCase()">
          {{ recurso.status }}
        </span>
      </div>

      <h3>{{ recurso.nome }}</h3>
      <p>{{ recurso.tipo }}</p>

      <div class="location">
        Localização: {{ recurso.localizacao }}
      </div>
    </div>
  }
</div>
